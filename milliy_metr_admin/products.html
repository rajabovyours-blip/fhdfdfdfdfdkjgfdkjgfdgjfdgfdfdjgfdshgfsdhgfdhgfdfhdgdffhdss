<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahsulotlar - Milliy Metr Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pagination {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 24px;
    }
    .pagination button {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--color-outline);
      background: var(--color-surface);
      border-radius: var(--radius-s);
      cursor: pointer;
    }
    .pagination button.active {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }
    .product-img-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .product-img-item {
      position: relative;
      width: 80px;
      height: 80px;
    }
    .product-img-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--color-outline);
    }
    .product-img-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--color-danger);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="d-flex justify-content-between align-items-center mb-24" style="margin-bottom: 24px;">
      <h2 style="margin: 0;">Mahsulotlar</h2>
      <div class="d-flex gap-12">
        <button class="btn btn-outline" id="btn-import-excel">
          <span class="material-symbols-rounded">upload_file</span>
          Excel orqali qo'shish
        </button>
        <button class="btn btn-primary" id="btn-add-product">
          <span class="material-symbols-rounded">add</span>
          Yangi Qo'shish
        </button>
      </div>
    </div>

    <div class="card mb-24" style="margin-bottom: 24px;">
      <div class="d-flex gap-16 align-items-center flex-wrap">
        <div class="form-group mb-0" style="margin:0; flex: 1; min-width: 250px;">
          <input type="text" class="form-control" id="search-input" placeholder="Mahsulot nomini qidiring...">
        </div>
        <div class="form-group mb-0" style="margin:0; width: 250px;">
          <select class="form-control" id="category-filter">
            <option value="">Barcha kategoriyalar</option>
            <!-- Filled by JS -->
          </select>
        </div>
        <button class="btn btn-primary" id="btn-search">
          <span class="material-symbols-rounded">search</span>
          Izlash
        </button>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th width="70">Rasm</th>
              <th>Nomi (Uz)</th>
              <th>Kategoriya</th>
              <th>Narx</th>
              <th>Qoldiq</th>
              <th width="120" class="text-center">Amallar</th>
            </tr>
          </thead>
          <tbody id="product-list">
            <tr>
              <td colspan="6" class="text-center">Yuklanmoqda...</td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div class="pagination" id="pagination">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <!-- Modal: Product Form -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <h3 id="modal-title" style="margin: 0;">Mahsulot Qo'shish</h3>
        <button class="modal-close" id="btn-close-modal"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="modal-body">
        <form id="product-form">
          <input type="hidden" id="prod-id">
          
          <div class="d-flex gap-24">
            <div style="flex: 1;">
              <h4 style="margin-bottom: 12px; font-size: 14px; color: var(--color-primary);">Asosiy ma'lumotlar</h4>
              
              <div class="form-group">
                <label class="form-label">Nomi (O'zbekcha) <span style="color:red">*</span></label>
                <input type="text" class="form-control" id="prod-name-uz" required>
              </div>
              <div class="form-group">
                <label class="form-label">Nomi (Ruscha)</label>
                <input type="text" class="form-control" id="prod-name-ru">
              </div>
              
              <div class="form-group">
                <label class="form-label">Tavsif (O'zbekcha)</label>
                <textarea class="form-control" id="prod-desc-uz"></textarea>
              </div>
              <div class="form-group">
                <label class="form-label">Tavsif (Ruscha)</label>
                <textarea class="form-control" id="prod-desc-ru"></textarea>
              </div>
              
            </div>
            
            <div style="flex: 1;">
              <h4 style="margin-bottom: 12px; font-size: 14px; color: var(--color-primary);">Kategoriya va Narx</h4>
              
              <div class="form-group">
                <label class="form-label">Kategoriya <span style="color:red">*</span></label>
                <select class="form-control" id="prod-category" required>
                  <!-- Filled by JS -->
                </select>
              </div>
              
              <div class="d-flex gap-16">
                <div class="form-group w-100">
                  <label class="form-label">Narx (so'm) <span style="color:red">*</span></label>
                  <input type="number" class="form-control" id="prod-price" required>
                </div>
                <div class="form-group w-100">
                  <label class="form-label">Chegirmali narx (Ixtiyoriy)</label>
                  <input type="number" class="form-control" id="prod-discount-price">
                </div>
              </div>
              
              <div class="d-flex gap-16">
                <div class="form-group w-100">
                  <label class="form-label">Birlik</label>
                  <select class="form-control" id="prod-unit">
                    <option value="dona">Dona</option>
                    <option value="kg">Kg</option>
                    <option value="litr">Litr</option>
                    <option value="metr">Metr</option>
                    <option value="kv.m">Kvadrat Metr</option>
                    <option value="qop">Qop</option>
                  </select>
                </div>
                <div class="form-group w-100">
                  <label class="form-label">Ombor qoldig'i <span style="color:red">*</span></label>
                  <input type="number" class="form-control" id="prod-stock" required value="0">
                </div>
              </div>
              
              <div class="form-group">
                <label class="form-label">Breand (Ishlab chiqaruvchi)</label>
                <input type="text" class="form-control" id="prod-brand">
              </div>
              
              <div class="form-group" style="margin-top: 24px;">
                <label class="form-label">Rasmlar</label>
                <input type="file" id="prod-img-upload" class="form-control" accept="image/*" style="padding-top: 10px;">
                <div class="product-img-list" id="prod-image-list">
                  <!-- JS renders images here -->
                </div>
              </div>
              
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="btn-cancel-modal">Bekor qilish</button>
        <button class="btn btn-primary" id="btn-save-product">Saqlash</button>
      </div>
    </div>
  </div>
  
  <!-- Excel Import Modal -->
  <div class="modal-overlay" id="import-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin: 0;">Excel orqali import</h3>
        <button class="modal-close" onclick="document.getElementById('import-modal').classList.remove('active')"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="modal-body text-center">
        <p style="margin-bottom: 24px;">.xlsx faylni yuklang. Fayl ichida Name, Category_ID, Price ustunlari bo'lishi shart.</p>
        <input type="file" id="excel-file" accept=".xlsx, .xls" class="form-control">
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="document.getElementById('import-modal').classList.remove('active')">Yopish</button>
        <button class="btn btn-primary" id="btn-upload-excel">Yuklash va Ko'rish</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/image-utils.js?v=2"></script>
  <script src="js/products.js?v=2"></script>
</body>
</html>
