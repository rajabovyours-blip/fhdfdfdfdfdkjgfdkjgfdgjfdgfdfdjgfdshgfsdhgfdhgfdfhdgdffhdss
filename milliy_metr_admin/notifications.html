<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bildirishnomalar - Milliy Metr Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app">
    <div class="d-flex justify-content-between align-items-center mb-24" style="margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
      <h2 style="margin: 0;" data-i18n="notifications">Push Bildirishnomalar</h2>
      <button class="btn btn-primary" id="btn-add-notification">
        <span class="material-symbols-rounded">send</span>
        <span data-i18n="notifications">Xabar Yuborish</span>
      </button>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 16px;" data-i18n="recentOrders">Yuborilgan xabarlar tarixi</h3>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th data-i18n="image">ID / Rasm</th>
              <th data-i18n="title">Sarlavha</th>
              <th>Matn</th>
              <th>Maqsad</th>
              <th data-i18n="date">Sana</th>
            </tr>
          </thead>
          <tbody id="notification-list">
            <tr>
              <td colspan="5" class="text-center" data-i18n="loading">Yuklanmoqda...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal: Broadcast Form -->
  <div class="modal-overlay" id="notification-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" style="margin: 0;" data-i18n="notifications">Push Xabar Yuborish</h3>
        <button class="modal-close" id="btn-close-modal"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="modal-body">
        <form id="notification-form">
          <div class="form-group">
            <label class="form-label" data-i18n="title">Sarlavha</label>
            <input type="text" class="form-control" id="notif-title" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Matn</label>
            <textarea class="form-control" id="notif-body" required></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label" data-i18n="image">Rasm yuklash (Ixtiyoriy)</label>
            <div class="d-flex gap-16 align-items-center form-row">
              <img id="notif-img-preview" src="" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; background: var(--color-surface-variant); display: none;">
              <input type="file" id="notif-img-upload" class="form-control" accept="image/*" style="padding-top: 10px;">
            </div>
            <input type="hidden" id="notif-image-url">
          </div>
          
          <div class="form-group">
            <label class="form-label">Maqsad</label>
            <select class="form-control" id="notif-target">
              <option value="all">Barcha mijozlarga</option>
              <option value="admins" data-i18n="admins">Faqat adminlarga</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="btn-cancel-modal" data-i18n="cancel">Bekor qilish</button>
        <button class="btn btn-primary" id="btn-save-notif">
          <span class="material-symbols-rounded">send</span>
          Yuborish
        </button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/image-utils.js?v=2"></script>
  <script src="js/notifications.js?v=2"></script>
</body>
</html>
