<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To'lovlar - Milliy Metr Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <link rel="stylesheet" href="css/style.css">
  <style>
    .raw-payload-pre {
      background: var(--color-surface-variant);
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .detail-label {
      color: var(--text-medium);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .detail-value {
      font-weight: 600;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="d-flex justify-content-between align-items-center" style="margin-bottom: 24px;">
      <h2 style="margin: 0;" data-i18n="payments">To'lovlar</h2>
    </div>

    <div class="card" style="margin-bottom: 16px;">
      <div class="d-flex gap-16 align-items-center flex-wrap">
        <div class="form-group mb-0 form-col" style="margin:0; min-width: 220px;">
          <input type="text" class="form-control" id="search-input" data-i18n-placeholder="search" placeholder="Qidirish...">
        </div>
        <div class="form-group mb-0" style="margin:0; width: 180px;">
          <select class="form-control" id="provider-filter">
            <option value="" data-i18n="allProviders">Barcha provayderlar</option>
            <option value="click">Click</option>
            <option value="payme">Payme</option>
          </select>
        </div>
        <div class="form-group mb-0" style="margin:0; width: 180px;">
          <select class="form-control" id="status-filter">
            <option value="" data-i18n="allStatuses">Barcha holatlar</option>
            <option value="created" data-i18n="ps_created">Yaratilgan</option>
            <option value="performed" data-i18n="ps_performed">To'langan</option>
            <option value="cancelled" data-i18n="ps_cancelled">Bekor qilingan</option>
            <option value="cancelled_after_perform" data-i18n="ps_refunded">Qaytarilgan</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th data-i18n="orderNumber">Buyurtma</th>
              <th data-i18n="customer">Mijoz</th>
              <th data-i18n="paymentMethods">Provayder</th>
              <th data-i18n="amount">Summa</th>
              <th data-i18n="status">Holat</th>
              <th data-i18n="date">Sana</th>
              <th class="text-center" data-i18n="actions">Amallar</th>
            </tr>
          </thead>
          <tbody id="payments-list">
            <tr><td colspan="8" class="text-center" data-i18n="loading">Yuklanmoqda...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Payment Detail Modal -->
  <div class="modal-overlay" id="payment-modal">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h3 style="margin:0;" data-i18n="payments">To'lov tafsilotlari</h3>
        <button class="modal-close" id="btn-close-modal">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="detail-grid">
          <div>
            <div class="detail-label" data-i18n="paymentMethods">Provayder</div>
            <div id="detail-provider" class="detail-value"></div>
          </div>
          <div>
            <div class="detail-label" data-i18n="status">Holat</div>
            <div id="detail-status" class="detail-value"></div>
          </div>
          <div>
            <div class="detail-label" data-i18n="amount">Summa</div>
            <div id="detail-amount" class="detail-value"></div>
          </div>
          <div>
            <div class="detail-label" data-i18n="transactionId">Tranzaksiya ID</div>
            <div id="detail-txn" class="detail-value" style="word-break: break-all;"></div>
          </div>
          <div>
            <div class="detail-label" data-i18n="created">Yaratilgan</div>
            <div id="detail-created" class="detail-value"></div>
          </div>
          <div>
            <div class="detail-label">To'langan vaqt</div>
            <div id="detail-performed" class="detail-value"></div>
          </div>
          <div>
            <div class="detail-label">Bekor qilingan vaqt</div>
            <div id="detail-cancelled" class="detail-value"></div>
          </div>
          <div>
            <div class="detail-label">Bekor sababi</div>
            <div id="detail-reason" class="detail-value"></div>
          </div>
        </div>
        <div>
          <div class="detail-label" style="margin-bottom: 8px;" data-i18n="rawPayload">Qo'shimcha ma'lumot</div>
          <pre class="raw-payload-pre" id="detail-raw"></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/payments.js"></script>
</body>
</html>
