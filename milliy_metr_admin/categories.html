<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategoriyalar - Milliy Metr Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app">
    <div class="d-flex justify-content-between align-items-center mb-24" style="margin-bottom: 24px;">
      <h2 style="margin: 0;">Kategoriyalar</h2>
      <button class="btn btn-primary" id="btn-add-category">
        <span class="material-symbols-rounded">add</span>
        Yangi Qo'shish
      </button>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th width="60">Rasm</th>
              <th>Nomi (Uz)</th>
              <th>Ota Kategoriya</th>
              <th width="120" class="text-center">Amallar</th>
            </tr>
          </thead>
          <tbody id="category-list">
            <tr>
              <td colspan="4" class="text-center">Yuklanmoqda...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal: Category Form -->
  <div class="modal-overlay" id="category-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" style="margin: 0;">Kategoriya Qo'shish</h3>
        <button class="modal-close" id="btn-close-modal"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="modal-body">
        <form id="category-form">
          <input type="hidden" id="cat-id">
          
          <div class="form-group">
            <label class="form-label">Nomi (O'zbekcha)</label>
            <input type="text" class="form-control" id="cat-name-uz" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Nomi (Ruscha)</label>
            <input type="text" class="form-control" id="cat-name-ru">
          </div>
          
          <div class="form-group">
            <label class="form-label">Nomi (Inglizcha)</label>
            <input type="text" class="form-control" id="cat-name-en">
          </div>
          
          <div class="form-group">
            <label class="form-label">Ota Kategoriya</label>
            <select class="form-control" id="cat-parent">
              <option value="">(Yo'q - Asosiy Kategoriya)</option>
              <!-- Filled via JS -->
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label">Rasm yuklash</label>
            <div class="d-flex gap-16 align-items-center">
              <img id="cat-img-preview" src="" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; background: var(--color-surface-variant); display: none;">
              <input type="file" id="cat-img-upload" class="form-control" accept="image/*" style="padding-top: 10px;">
            </div>
            <input type="hidden" id="cat-image-url">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="btn-cancel-modal">Bekor qilish</button>
        <button class="btn btn-primary" id="btn-save-category">Saqlash</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/image-utils.js?v=2"></script>
  <script src="js/categories.js?v=2"></script>
</body>
</html>
