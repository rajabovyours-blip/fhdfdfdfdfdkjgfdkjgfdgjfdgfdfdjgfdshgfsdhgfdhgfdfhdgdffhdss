<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Milliy Metr Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <link rel="stylesheet" href="css/style.css">
  <style>
    .chat-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      height: calc(100vh - 180px);
      min-height: 480px;
    }
    @media (max-width: 900px) {
      .chat-layout { grid-template-columns: 1fr; height: auto; }
      .chat-thread { min-height: 420px; }
    }

    .session-list {
      overflow-y: auto;
      padding: 0;
against    }
    .session-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--color-divider, #eee);
      cursor: pointer;
      transition: background 0.15s;
    }
    .session-item:hover { background: var(--color-surface-variant); }
    .session-item.active {
      background: var(--color-surface-variant);
      border-left: 3px solid var(--color-primary);
    }
    .session-name { font-weight: 600; font-size: 14px; }
    .session-phone { font-size: 12px; color: var(--text-medium); margin-top: 2px; }
    .session-preview {
      font-size: 12px; color: var(--text-medium); margin-top: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .chat-thread { display: flex; flex-direction: column; }
    .chat-header {
      padding: 16px;
      border-bottom: 1px solid var(--color-divider, #eee);
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap;
    }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; }
    .msg-user {
      align-self: flex-start;
      background: var(--color-surface-variant);
      border-bottom-left-radius: 4px;
    }
    .msg-admin {
      align-self: flex-end;
      background: var(--color-primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-time { font-size: 10px; opacity: 0.7; margin-top: 4px; }

    .chat-input {
      padding: 12px 16px;
      border-top: 1px solid var(--color-divider, #eee);
      display: flex; gap: 10px; align-items: center;
    }
    .chat-input input { flex: 1; }
    .chat-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--text-medium); font-size: 14px; text-align: center; padding: 24px;
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="d-flex justify-content-between align-items-center" style="margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
      <h2 style="margin: 0;" data-i18n="chat">Mijozlar bilan chat</h2>
      <div class="d-flex gap-12 align-items-center">
        <select class="form-control" id="filter-resolved" style="width: 200px;">
          <option value="false" data-i18n="chatOpen">Ochiq suhbatlar</option>
          <option value="" data-i18n="allStatuses">Barchasi</option>
          <option value="true" data-i18n="chatResolved">Yopilganlar</option>
        </select>
        <button class="btn btn-outline btn-sm" id="btn-refresh">
          <span class="material-symbols-rounded" style="font-size:18px;">refresh</span>
        </button>
      </div>
    </div>

    <div class="chat-layout">
      <div class="card session-list" id="session-list" style="padding:0;">
        <div style="padding:16px; color:var(--text-medium); font-size:13px;" data-i18n="loading">Yuklanmoqda...</div>
      </div>

      <div class="card chat-thread" id="chat-thread" style="padding:0;">
        <div class="chat-empty" id="thread-placeholder" data-i18n="chatSelectSession">
          Suhbatni tanlang
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
