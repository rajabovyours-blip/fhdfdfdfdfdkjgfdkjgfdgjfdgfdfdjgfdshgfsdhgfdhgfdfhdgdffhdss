<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adminlar - Milliy Metr Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app">
    <div class="d-flex justify-content-between align-items-center mb-24" style="margin-bottom: 24px;">
      <h2 style="margin: 0;">Administratorlar</h2>
      <button class="btn btn-primary" id="btn-add-admin">
        <span class="material-symbols-rounded">add</span>
        Yangi Qo'shish
      </button>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>F.I.Sh.</th>
              <th>Username</th>
              <th>Rol</th>
              <th>Holat</th>
              <th width="120" class="text-center">Amallar</th>
            </tr>
          </thead>
          <tbody id="admin-list">
            <tr>
              <td colspan="5" class="text-center">Yuklanmoqda...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal: Admin Form -->
  <div class="modal-overlay" id="admin-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" style="margin: 0;">Admin Qo'shish</h3>
        <button class="modal-close" id="btn-close-modal"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="modal-body">
        <form id="admin-form">
          <input type="hidden" id="admin-id">
          
          <div class="form-group">
            <label class="form-label">F.I.Sh.</label>
            <input type="text" class="form-control" id="admin-fullname" required>
          </div>
          
          <div class="form-group" id="group-username">
            <label class="form-label">Foydalanuvchi nomi (Username)</label>
            <input type="text" class="form-control" id="admin-username" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Parol <span id="pwd-hint" style="font-weight:normal; color:var(--text-medium); font-size:12px;"></span></label>
            <input type="password" class="form-control" id="admin-password">
          </div>
          
          <div class="d-flex gap-16">
            <div class="form-group w-100">
              <label class="form-label">Rol</label>
              <select class="form-control" id="admin-role">
                <option value="ADMIN">ADMIN</option>
                <option value="OWNER">OWNER</option>
              </select>
            </div>
            
            <div class="form-group w-100" id="group-active" style="display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 12px; display: none;">
              <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" id="admin-active" style="width: 18px; height: 18px;">
                <span class="form-label" style="margin:0;">Faol</span>
              </label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="btn-cancel-modal">Bekor qilish</button>
        <button class="btn btn-primary" id="btn-save-admin">Saqlash</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/admin-users.js"></script>
</body>
</html>
