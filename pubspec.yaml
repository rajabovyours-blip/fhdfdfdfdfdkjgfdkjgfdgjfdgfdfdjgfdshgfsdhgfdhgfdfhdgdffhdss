name: milliy_metr
description: Enterprise Multi-Vendor Construction Materials Marketplace
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.2

  # Functional & Data Types
  fpdart: ^1.1.0
  equatable: ^2.0.5
  collection: ^1.18.0

  # Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Environment & Localization
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2

  # Social Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^8.1.0

  # UI / UX
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  responsive_builder: ^0.7.0

  # System Utilities
  logger: ^2.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.1
  connectivity_plus: ^6.0.3
  internet_connection_checker: ^1.0.0+1
  uuid: ^4.6.0
  url_launcher: ^6.2.6
  geolocator: ^14.0.2
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.9
  freezed: ^2.4.7
  riverpod_generator: ^2.4.0
  json_serializable: ^6.7.1

  # Linting
  flutter_lints: ^3.0.1
  custom_lint: ^0.6.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/categories/
    - assets/images/milliy_metr_logo_transparent.png
    - assets/svg/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/milliy_metr_logo_transparent.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  image: "assets/images/milliy_metr_logo_transparent.png"
  image_dark: "assets/images/milliy_metr_logo_transparent.png"
  android_12:
    image: "assets/images/milliy_metr_logo_transparent.png"
    image_dark: "assets/images/milliy_metr_logo_transparent.png"
    color: "#000000"
    color_dark: "#000000"
