services:
  - type: web
    name: milliy-metr-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: POSTGRES_SERVER
        fromDatabase:
          name: milliy-metr-db
          property: host
      - key: POSTGRES_USER
        fromDatabase:
          name: milliy-metr-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: milliy-metr-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: milliy-metr-db
          property: database
      - key: REDIS_URL
        fromService:
          type: redis
          name: milliy-metr-redis
          property: connectionString

  - type: web
    name: milliy-metr-admin
    env: static
    rootDir: milliy_metr_admin
    buildCommand: ""
    staticPublishPath: "./"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: redis
    name: milliy-metr-redis
    ipAllowList: [] # Allow only internal Render traffic
    plan: free

databases:
  - name: milliy-metr-db
    databaseName: milliy_metr
    user: admin
    plan: free
